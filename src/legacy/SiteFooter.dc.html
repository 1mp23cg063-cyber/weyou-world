<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400;1,6..72,500&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
@keyframes wmCycle{0%{color:#7fd4e8}11%{color:#c9a9e0}22%{color:#e8d078}33%{color:#7fd4e8}100%{color:#7fd4e8}}
@keyframes wmCycle2{0%{color:#c9a9e0}11%{color:#e8d078}22%{color:#7fd4e8}33%{color:#c9a9e0}100%{color:#c9a9e0}}
@keyframes wmCycle3{0%{color:#e8d078}11%{color:#7fd4e8}22%{color:#c9a9e0}33%{color:#e8d078}100%{color:#e8d078}}
@keyframes wmSpec{0%{color:#f08aa0}6%{color:#f0b070}12%{color:#e8d078}18%{color:#8fd8b0}24%{color:#7fd4e8}30%{color:#c9a9e0}33%{color:#f08aa0}100%{color:#f08aa0}}
@keyframes wmStar{0%,100%{opacity:0;transform:scale(.3) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(180deg)}}
@keyframes wmBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes wmNone{}
@keyframes shine{0%{background-position:200% center}100%{background-position:-200% center}}
</style>
</helmet>
<footer style="background:#040c16;color:rgba(255,255,255,.4);padding:40px clamp(16px,4vw,40px);font-size:12px;font-family:'DM Sans',sans-serif;text-align:{{ ta }}">
  <div style="max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:{{ jc }};align-items:{{ ai }};gap:28px">
    <div style="display:flex;flex-direction:column;align-items:{{ ai }};gap:12px">
      <span style="position:relative;display:inline-flex;align-items:flex-start;font-weight:500;font-size:20px;letter-spacing:.01em;animation:wmBob 6s ease-in-out infinite"><span style="display:inline-block;color:#7fd4e8;animation:{{ wmA }} 18s ease-in-out infinite">we</span><span style="display:inline-block;color:#c9a9e0;animation:{{ wmB }} 18s ease-in-out infinite -12s">You</span><sup style="font-size:.34em;line-height:1;margin-left:.06em;color:rgba(255,255,255,.45);align-self:flex-start;position:relative;top:.25em">™</sup><span style="display:inline-block;margin-left:.2em;color:#e8d078;animation:{{ wmC }} 18s ease-in-out infinite -6s">World</span><span style="position:absolute;right:1.55em;top:-.42em;font-size:.38em;line-height:1;color:#e8d078;text-shadow:0 0 8px rgba(232,208,120,.9);pointer-events:none;animation:wmStar 5s ease-in-out infinite 1s">✦</span></span>
      <span style="color:#e8d078;max-width:320px;line-height:1.6">AI-powered websites and conversations. A division of weYou X — a fully AI entity.</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;justify-content:{{ jc }};gap:40px">
      <div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#e8d078;margin-bottom:4px">Pages</span><a href="Home.dc.html" style="color:rgba(255,255,255,.4)">Home</a><a href="About.dc.html" style="color:rgba(255,255,255,.4)">About</a><a href="Features.dc.html" style="color:rgba(255,255,255,.4)">Features</a><a href="Contact.dc.html" style="color:rgba(255,255,255,.4)">Contact</a></div>
      <div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#e8d078;margin-bottom:4px">Company</span><a href="mailto:info@weyoux.com" style="color:rgba(255,255,255,.4)">info@weyoux.com</a><a href="https://weyoux.com" style="color:rgba(255,255,255,.4)">weYou X</a><a href="https://legalindia.ai" style="color:rgba(255,255,255,.4)">LegalIndia.ai</a></div>
    </div>
  </div>
  <div style="max-width:1100px;margin:28px auto 0;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-wrap:wrap;justify-content:{{ jc }};gap:12px;font-size:11px">
    <span>Bangalore · © 2026 weYou World — a division of weYou X</span>
    <div style="display:flex;gap:16px"><a href="#" style="color:rgba(255,255,255,.4)">Privacy</a><a href="#" style="color:rgba(255,255,255,.4)">Terms</a></div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:260},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;wordmark&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;brand&quot;,&quot;options&quot;:[&quot;brand&quot;,&quot;spectrum&quot;,&quot;static&quot;],&quot;tsType&quot;:&quot;'brand'|'spectrum'|'static'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = !!this.props.mobile, mode = this.props.wordmark ?? 'brand';
    return { ta: m ? 'center' : 'left', jc: m ? 'center' : 'space-between', ai: m ? 'center' : 'flex-start',
      wmA: mode === 'static' ? 'wmNone' : mode === 'spectrum' ? 'wmSpec' : 'wmCycle', wmB: mode === 'static' ? 'wmNone' : mode === 'spectrum' ? 'wmSpec' : 'wmCycle2', wmC: mode === 'static' ? 'wmNone' : mode === 'spectrum' ? 'wmSpec' : 'wmCycle3' };
  }
}
</script>
</body>
</html>
